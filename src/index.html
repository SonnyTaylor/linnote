<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linnote</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .loader {
        text-align: center;
      }
      .loader h1 {
        font-size: 2rem;
        font-weight: 300;
        margin-bottom: 1rem;
        color: #7b2ff7;
      }
      .loader p {
        font-size: 0.9rem;
        opacity: 0.6;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 1.5rem auto;
        border: 3px solid rgba(123, 47, 247, 0.2);
        border-top-color: #7b2ff7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <h1>Linnote</h1>
      <div class="spinner"></div>
      <p>Loading OneNote&hellip;</p>
    </div>
  </body>
</html>
